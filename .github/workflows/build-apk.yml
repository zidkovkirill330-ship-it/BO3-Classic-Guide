name: Build BO3 Classic Release APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
          echo "/usr/local/lib/android/sdk/platform-tools" >> "$GITHUB_PATH"

          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create signing key
        run: |
          keytool -genkeypair \
            -v \
            -keystore release-key.jks \
            -alias bo3classic \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass bo3classic123 \
            -keypass bo3classic123 \
            -dname "CN=BO3 Classic Guide, OU=BO3, O=BO3 Classic, L=Unknown, S=Unknown, C=US"

      - name: Build release APK
        run: |
          gradle assembleRelease \
            -Pandroid.injected.signing.store.file="$GITHUB_WORKSPACE/release-key.jks" \
            -Pandroid.injected.signing.store.password=bo3classic123 \
            -Pandroid.injected.signing.key.alias=bo3classic \
            -Pandroid.injected.signing.key.password=bo3classic123

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk \
             app/build/outputs/apk/release/BO3-Classic-Guide-v1.0.0.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: BO3-Classic-Guide-Release
          path: app/build/outputs/apk/release/BO3-Classic-Guide-v1.0.0.apk
          if-no-files-found: error
